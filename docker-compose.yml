services:
  postgres:
    image: postgres:16-alpine
    container_name: itf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: internal_tools
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d internal_tools"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
